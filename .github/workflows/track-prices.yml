name: Track Skin Prices

on:
  schedule:
    - cron: "0 7,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Собрать цены
        run: python track_prices.py

      - name: Сохранить обновлённые данные в репозиторий
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.csv
          git diff --quiet --cached || git commit -m "Обновление цен $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push